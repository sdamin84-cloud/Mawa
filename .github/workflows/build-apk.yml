name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare build environment and keys
        run: |
          # 1. Provide fallback .env for Secrets Gradle plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # 2. Decode debug keystore if base64 file exists
          if [ -f debug.keystore.base64 ]; then
            mkdir -p ~/.android
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore 2>/dev/null || true
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 3. Clean any stale caches
          rm -rf .gradle
          rm -rf app/build

          # 4. Make gradlew executable
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Ensure APK is in public/ for Web & Netlify deployment
        run: |
          mkdir -p public
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk public/mawa-digital-khata.apk
            echo "Successfully synced APK to public/mawa-digital-khata.apk"
            ls -lh public/mawa-digital-khata.apk
          else
            echo "Error: Debug APK was not generated!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mawa-digital-khata-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
